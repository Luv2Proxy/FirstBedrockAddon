name: Build Bedrock Addon

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Prepare addon folders and generate UUIDs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist release
          mkdir -p dist release

          cp -r behavior_pack dist/SkyArchipelago_BP
          cp -r resource_pack dist/SkyArchipelago_RP

          find dist -type f -name '.DS_Store' -delete

          # Every packaged build gets fresh UUIDs. This prevents Minecraft from
          # treating a newly built pack as the exact same installed pack.
          python3 - <<'PY'
          import json
          import uuid
          from pathlib import Path

          bp = Path('dist/SkyArchipelago_BP/manifest.json')
          rp = Path('dist/SkyArchipelago_RP/manifest.json')

          def new_uuid():
              return str(uuid.uuid4())

          with bp.open(encoding='utf-8') as f:
              bp_data = json.load(f)

          with rp.open(encoding='utf-8') as f:
              rp_data = json.load(f)

          # Fresh pack UUIDs.
          bp_uuid = new_uuid()
          rp_uuid = new_uuid()

          bp_data['header']['uuid'] = bp_uuid
          rp_data['header']['uuid'] = rp_uuid

          # Fresh module UUIDs for every module in both packs.
          for module in bp_data.get('modules', []):
              module['uuid'] = new_uuid()

          for module in rp_data.get('modules', []):
              module['uuid'] = new_uuid()

          # Make the BP depend on this exact build's RP UUID.
          for dependency in bp_data.get('dependencies', []):
              if dependency.get('uuid'):
                  dependency['uuid'] = rp_uuid

          with bp.open('w', encoding='utf-8') as f:
              json.dump(bp_data, f, indent=2)
              f.write('\n')

          with rp.open('w', encoding='utf-8') as f:
              json.dump(rp_data, f, indent=2)
              f.write('\n')

          print(f'Generated BP UUID: {bp_uuid}')
          print(f'Generated RP UUID: {rp_uuid}')
          print('Generated fresh module UUIDs.')
          PY

      - name: Validate manifests
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          bp_path = Path('dist/SkyArchipelago_BP/manifest.json')
          rp_path = Path('dist/SkyArchipelago_RP/manifest.json')

          with bp_path.open(encoding='utf-8') as f:
              bp = json.load(f)

          with rp_path.open(encoding='utf-8') as f:
              rp = json.load(f)

          assert bp['header']['uuid']
          assert rp['header']['uuid']
          assert bp.get('modules')
          assert rp.get('modules')

          script_modules = [m for m in bp['modules'] if m.get('type') == 'script']
          assert script_modules, 'Behavior pack has no script module'
          assert script_modules[0].get('entry') == 'scripts/main.js', \
              'Script entry must be scripts/main.js'

          assert any(
              d.get('module_name') == '@minecraft/server'
              for d in bp.get('dependencies', [])
          ), '@minecraft/server dependency is missing'

          assert any(
              d.get('uuid') == rp['header']['uuid']
              for d in bp.get('dependencies', [])
          ), 'Behavior pack does not depend on the generated resource pack UUID'

          print(f'Validated BP UUID: {bp["header"]["uuid"]}')
          print(f'Validated RP UUID: {rp["header"]["uuid"]}')
          print('Validated script entry: scripts/main.js')
          print('Validated @minecraft/server dependency')
          PY

      - name: Build MCPACK files
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          zip -r ../SkyArchipelago_BP.mcpack \
            SkyArchipelago_BP >/dev/null

          zip -r ../SkyArchipelago_RP.mcpack \
            SkyArchipelago_RP >/dev/null

      - name: Build MCADDON
        shell: bash
        run: |
          set -euo pipefail

          zip -j release/SkyArchipelago.mcaddon \
            SkyArchipelago_BP.mcpack \
            SkyArchipelago_RP.mcpack >/dev/null

          echo "Created:"
          ls -lh release/SkyArchipelago.mcaddon

      - name: Upload MCADDON CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyArchipelago-${{ steps.version.outputs.version }}-mcaddon
          path: release/SkyArchipelago.mcaddon
          if-no-files-found: error

      - name: Upload MCPACK CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyArchipelago-${{ steps.version.outputs.version }}-mcpacks
          path: |
            SkyArchipelago_BP.mcpack
            SkyArchipelago_RP.mcpack
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SkyArchipelago ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/SkyArchipelago.mcaddon
            SkyArchipelago_BP.mcpack
            SkyArchipelago_RP.mcpack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
