name: Build Bedrock Addon

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare addon folders
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist release
          mkdir -p dist release

          cp -r behavior_pack dist/SkyArchipelago_BP
          cp -r resource_pack dist/SkyArchipelago_RP

          find dist -type f -name '.DS_Store' -delete

      - name: Validate manifests
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in [
              Path('behavior_pack/manifest.json'),
              Path('resource_pack/manifest.json')
          ]:
              with path.open(encoding='utf-8') as f:
                  data = json.load(f)

              assert data.get('header', {}).get('uuid'), \
                  f'{path}: missing header UUID'

              assert data.get('modules'), \
                  f'{path}: missing modules'

              print(f'Validated {path}')
          PY

      - name: Build MCPACK files
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          zip -r ../SkyArchipelago_BP.mcpack \
            SkyArchipelago_BP >/dev/null

          zip -r ../SkyArchipelago_RP.mcpack \
            SkyArchipelago_RP >/dev/null

      - name: Build MCADDON
        shell: bash
        run: |
          set -euo pipefail

          # A .mcaddon is a ZIP containing the .mcpack files.
          # The -j flag ensures the packs are placed directly inside
          # the MCADDON without an extra directory layer.
          zip -j release/SkyArchipelago.mcaddon \
            SkyArchipelago_BP.mcpack \
            SkyArchipelago_RP.mcpack >/dev/null

          echo "Created:"
          ls -lh release/SkyArchipelago.mcaddon

      # This artifact will appear as a ZIP when downloaded from
      # GitHub Actions. This is a limitation of upload-artifact.
      - name: Upload MCADDON CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyArchipelago-mcaddon
          path: release/SkyArchipelago.mcaddon
          if-no-files-found: error

      - name: Upload MCPACK CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyArchipelago-mcpacks
          path: |
            SkyArchipelago_BP.mcpack
            SkyArchipelago_RP.mcpack
          if-no-files-found: error

      # A GitHub Release asset is downloaded directly as .mcaddon,
      # rather than being wrapped in an Actions artifact ZIP.
      - name: Publish MCADDON Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SkyArchipelago Latest Build
          prerelease: true
          make_latest: false
          files: |
            release/SkyArchipelago.mcaddon
            SkyArchipelago_BP.mcpack
            SkyArchipelago_RP.mcpack
          body: |
            Automatically generated Sky Archipelago Bedrock addon build.

            Download `SkyArchipelago.mcaddon` and open it with Minecraft Bedrock
            to import both the Behavior Pack and Resource Pack.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
