name: Build Bedrock Addon

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Prepare addon folders
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist release
          mkdir -p dist release

          cp -r behavior_pack dist/SkyArchipelago_BP
          cp -r resource_pack dist/SkyArchipelago_RP

          find dist -type f -name '.DS_Store' -delete

      - name: Validate manifests
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in [
              Path('behavior_pack/manifest.json'),
              Path('resource_pack/manifest.json')
          ]:
              with path.open(encoding='utf-8') as f:
                  data = json.load(f)

              assert data.get('header', {}).get('uuid'), \
                  f'{path}: missing header UUID'

              assert data.get('modules'), \
                  f'{path}: missing modules'

              print(f'Validated {path}')
          PY

      - name: Build MCPACK files
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          zip -r ../SkyArchipelago_BP.mcpack \
            SkyArchipelago_BP >/dev/null

          zip -r ../SkyArchipelago_RP.mcpack \
            SkyArchipelago_RP >/dev/null

      - name: Build MCADDON
        shell: bash
        run: |
          set -euo pipefail

          zip -j release/SkyArchipelago.mcaddon \
            SkyArchipelago_BP.mcpack \
            SkyArchipelago_RP.mcpack >/dev/null

          echo "Created:"
          ls -lh release/SkyArchipelago.mcaddon

      - name: Upload MCADDON CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyArchipelago-${{ steps.version.outputs.version }}-mcaddon
          path: release/SkyArchipelago.mcaddon
          if-no-files-found: error

      - name: Upload MCPACK CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyArchipelago-${{ steps.version.outputs.version }}-mcpacks
          path: |
            SkyArchipelago_BP.mcpack
            SkyArchipelago_RP.mcpack
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SkyArchipelago ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/SkyArchipelago.mcaddon
            SkyArchipelago_BP.mcpack
            SkyArchipelago_RP.mcpack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
